<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; }
  .bar { padding: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: #f3f3f3; }
  #login { max-width: 320px; margin: 60px auto; display: flex; flex-direction: column; gap: 8px; }
  #map { height: 78vh; }
  #stats { font-weight: 600; }
</style>
</head>
<body>
<div id="login">
  <h3>Sign in</h3>
  <input id="email" type="email" placeholder="Email">
  <input id="pw" type="password" placeholder="Password">
  <button id="loginBtn">Sign in</button>
  <div id="msg" style="color:#b00"></div>
</div>

<div id="app" hidden>
  <div class="bar">
    <input id="dev" value="dad-phone" size="10">
    <select id="win">
      <option value="30">Last 30 min</option>
      <option value="60" selected>Last 1 hour</option>
      <option value="180">Last 3 hours</option>
    </select>
    <button id="loadBtn">Refresh</button>
    <label><input id="auto" type="checkbox" checked> auto-refresh</label>
    <span id="stats"></span>
  </div>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://xlednrkvfacpmoqhfdwt.supabase.co";
const SUPABASE_KEY = "sb_publishable_411MfS_0YIyyr4AFkYQ39A_C47htskN";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let map, layer, first = true;

async function load() {
  const since = new Date(Date.now() - Number($('win').value) * 60000).toISOString();
  const { data, error } = await sb.from('locations')
    .select('lat,lng,speed,recorded_at')
    .eq('device_id', $('dev').value)
    .gte('recorded_at', since)
    .order('recorded_at')
    .limit(5000);
  if (error) { $('stats').textContent = error.message; return; }
  layer.clearLayers();
  if (!data.length) { $('stats').textContent = 'No points in this time window'; return; }

  const ll = data.map(p => [p.lat, p.lng]);
  const b = data[data.length - 1];
  L.polyline(ll, { weight: 4 }).addTo(layer);
  L.circleMarker(ll[ll.length - 1], { radius: 9, color: 'red', fillOpacity: 0.9 }).addTo(layer);

  const ago = Math.round((Date.now() - new Date(b.recorded_at)) / 1000);
  const kmh = b.speed != null ? Math.round(b.speed * 3.6) : 0;
  $('stats').textContent = 'Last seen ' + (ago < 90 ? ago + ' s' : Math.round(ago / 60) + ' min')
    + ' ago | ' + kmh + ' km/h';

  if (first) { map.fitBounds(L.latLngBounds(ll).pad(0.2)); first = false; }
  else if (!map.getBounds().contains(ll[ll.length - 1])) map.panTo(ll[ll.length - 1]);
}

function showApp() {
  $('login').hidden = true; $('app').hidden = false;
  map = L.map('map').setView([13.08, 80.27], 11);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
  layer = L.layerGroup().addTo(map);
  load();
}

$('loginBtn').onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value, password: $('pw').value });
  if (error) $('msg').textContent = error.message; else showApp();
};
$('loadBtn').onclick = () => { first = true; load(); };
$('win').onchange = () => { first = true; load(); };
setInterval(() => { if ($('auto').checked && !$('app').hidden) load(); }, 10000);
sb.auth.getSession().then(({ data }) => { if (data.session) showApp(); });
</script>
</body>
</html>
